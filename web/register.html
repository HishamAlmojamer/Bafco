<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>إنشاء حساب جديد</title>
    <link rel="stylesheet" href="/assets/app.css" />
  </head>
  <body>
    <header class="topbar">
      <div class="brand">بافكو | BAFCO</div>
      <nav class="topnav">
        <a href="/index.html" class="navlink" data-link>الرئيسية</a>
        <a href="/products.html" class="navlink" data-link>منتجاتنا</a>
      </nav>
    </header>

    <main class="container">
      <div class="auth-wrapper">
        <div class="auth-card">
          <h1>إنشاء حساب جديد</h1>
          <p style="text-align: center; color: #666; margin-bottom: 20px;">انضم إلى عائلة بافكو واستمتع بمنتجاتنا الطازجة</p>
          <div class="form">
            <label class="label" for="name">الاسم الكامل</label>
            <input id="name" class="input" type="text" placeholder="أدخل اسمك الكامل" />

            <label class="label" for="email">البريد الإلكتروني</label>
            <input id="email" class="input" type="email" placeholder="example@mail.com" />

            <label class="label" for="phone">رقم الجوال</label>
            <input id="phone" class="input" type="tel" placeholder="05xxxxxxxx" />

            <label class="label" for="password">كلمة المرور</label>
            <input id="password" class="input" type="password" placeholder="••••••••" />

            <button class="btn btn-primary" id="btnRegister" style="width: 100%; margin-top: 10px;">إنشاء الحساب</button>
            <div id="msg" class="msg" style="text-align: center; margin-top: 15px;"></div>

            <div style="text-align: center; margin-top: 20px;">
                <span>لديك حساب بالفعل؟</span>
                <a href="/login.html" style="color: var(--primary); text-decoration: none; font-weight: bold;">تسجيل الدخول</a>
            </div>
          </div>
        </div>
      </div>
    </main>

    <footer class="footer">
      <div class="dev-info">
        <div class="dev-name">تصميم وتطوير: المهندس هشام المجمر</div>
        <div class="contact-links">
          <a href="tel:773988932" class="contact-item">📞 773988932</a>
          <a href="tel:779254189" class="contact-item">📞 779254189</a>
        </div>
      </div>
      <div class="copyright">
        &copy; 2026 جميع الحقوق محفوظة لمصنع بافكو للأغذية.
      </div>
    </footer>

    <script src="/assets/app.js"></script>
    <script>
      window.addEventListener('DOMContentLoaded', () => {
        const nameEl = document.getElementById('name');
        const emailEl = document.getElementById('email');
        const phoneEl = document.getElementById('phone');
        const passEl = document.getElementById('password');
        const msgEl = document.getElementById('msg');

        document.getElementById('btnRegister').addEventListener('click', async () => {
          msgEl.textContent = '';
          msgEl.style.color = '#e74c3c';
          
          const name = nameEl.value.trim();
          const email = emailEl.value.trim();
          const phone = phoneEl.value.trim();
          const password = passEl.value;

          if (!name || !email || !password) {
            msgEl.textContent = 'يرجى ملء جميع الحقول الإلزامية';
            return;
          }

          try {
            const data = await api.register({ name, email, phone, password });
            api.setToken(data.token);
            msgEl.textContent = 'تم إنشاء الحساب بنجاح! جاري التحويل...';
            msgEl.style.color = '#27ae60';
            setTimeout(() => {
              window.location.href = '/dashboard.html';
            }, 1500);
          } catch (e) {
            msgEl.textContent = e?.message || 'تعذر إنشاء الحساب';
          }
        });
      });
    </script>
  </body>
</html>
