version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: bafco-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: bafco
      POSTGRES_PASSWORD: bafco_secret
      POSTGRES_DB: bafco
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: bafco-cache
    restart: unless-stopped
    ports:
      - '6379:6379'
    command: redis-server --appendonly yes
    volumes:
      - redisdata:/data

volumes:
  pgdata:
  redisdata:
